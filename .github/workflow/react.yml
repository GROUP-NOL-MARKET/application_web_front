name: CI React

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  react:
    name: Build & Lint React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "REACT_APP_API_URL=http://localhost:8000/api" >> .env
          echo "REACT_APP_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env

      - name: Build
        run: npm run build
